url: https://myaseen208.com/mhpfilter/
title: Modified and Fully Modified Hodrick-Prescott Filters

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: mathjax
  bslib:
    base_font:
      google: Crimson Pro
    heading_font:
      google: Crimson Pro
    code_font:
      google: JetBrains Mono
    bg: "#ffffff"
    fg: "#1a1a1a"
    primary: "#2c5f8a"
    link-color: "#2c5f8a"

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left:  [home, reference, articles, pdf, news]
    right: [search, github]
  components:
    pdf:
      text: PDF
      href: pdf/index.html

articles:
  - title: Getting started
    navbar: Getting started
    contents:
      - mhpfilter_01_getting_started
      - mhpfilter_02_theory
  - title: The two papers
    navbar: Methods
    contents:
      - mhpfilter_03_modified_hp
      - mhpfilter_04_fully_modified_hp
      - mhpfilter_05_simulation
  - title: Application, validation and speed
    navbar: Application and validation
    contents:
      - mhpfilter_06_app
      - mhpfilter_07_validation

reference:
  # every help page must appear (tools/check-pkgdown-index.R)
  - title: Filters
    desc: HP, modified HP (Choudhary et al. 2014) and fully modified HP (Hanif et al. 2017) filters.
    contents:
      - hp_filter
      - mhp_filter
      - fmhp_filter
  - title: Many series and comparisons
    contents:
      - mhp_batch
      - fmhp_batch
      - mhp_compare
      - fmhp_compare
  - title: End-point diagnostics
    desc: Weights, gains and end-point loss of HP-type filters with any smoothing parameters.
    contents:
      - hp_schedule
      - hp_weights
      - hp_gain
      - hp_loss
  - title: Simulation
    contents:
      - mhp_designs
      - mhp_simulate
      - fmhp_simulation
  - title: Results, plots and interpretation
    contents:
      - get_lambda
      - print.mhp
      - autoplot.mhp
      - plot_comparison
      - plot_batch
      - mhp_interpret
      - mhp-methods
  - title: Application
    contents:
      - mhp_app
  - title: Data
    contents:
      - us_macro
  - title: Utilities
    contents:
      - mhp_cite
      - mhp_theme
      - mhp_save
      - mhp_notation
      - mhp_reference
      - mhpfilter-package

footer:
  structure:
    left: developed_by
    right: built_with
